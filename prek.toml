exclude = "^tests|^docs|^examples|^notebooks"
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "pretty-format-json"
args = ["--autofix"]

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "main", "--branch", "dev"]

[[repos.hooks]]
id = "check-added-large-files"


[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.8"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix", "--ignore=C901", "--preview"]

[[repos.hooks]]
id = "ruff-format"


[[repos]]
repo = "https://github.com/conorfalvey/check_pdb_hook"
rev = "0.0.9"
[[repos.hooks]]
id = "check_pdb_hook"
pass_filenames = false


[[repos]]
repo = "https://github.com/PyCQA/bandit.git"
rev = "1.9.4"
[[repos.hooks]]
id = "bandit"
args = ["-lll", "--recursive", "clumper"]


[[repos]]
repo = "https://github.com/python-poetry/poetry"
rev = "2.4.1"
[[repos.hooks]]
id = "poetry-check"

[[repos.hooks]]
id = "poetry-lock"

[[repos.hooks]]
id = "poetry-install"
args = ["--all-extras", "--all-groups"]

[[repos]]
repo = "https://github.com/GabDug/sync-pre-commit-lock"
rev = "v0.9.0"

[[repos.hooks]]
id = "sync-pre-commit-uv"

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.32"

[[repos.hooks]]
id = "uv-lock"

[[repos]]
repo = "https://github.com/citation-file-format/cffconvert"
rev = "b6045d78aac9e02b039703b030588d54d53262ac"

[[repos.hooks]]
id = "validate-cff"

[[repos]]
repo = "https://github.com/DetachHead/basedpyright-prek-mirror"
rev = "1.39.9"

[[repos.hooks]]
id = "basedpyright"
