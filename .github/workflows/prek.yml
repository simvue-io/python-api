name: Prek Hooks

on:
  push:
    branches: ["main", "dev", "hotfix/update-ci", "*prek*"]
  pull_request:
    branches: ["main", "dev", "hotfix/update-ci", "*prek*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Run Prek Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Prek
        run: python -m pip install prek
      - name: Run Prek on Repository
        run: prek run --all-files --skip no-commit-to-branch
