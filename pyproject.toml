[project]
name = "simvue"
version = "2.5.10"
description = "Simulation tracking and monitoring"
authors = [{ name = "Simvue Development Team", email = "info@simvue.io" }]
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
  "Typing :: Typed",
]

keywords = [
  "tracking",
  "monitoring",
  "metrics",
  "alerting",
  "metrics-gathering",
]
dependencies = [
  "requests (>=2.32.3,<3.0.0)",
  "pydantic (>=2.11,<3.0.0)",
  "tabulate (>=0.9.0,<0.11.0)",
  "pyjwt (>=2.13.0,<3.0.0)",
  "pandas>=2.2.3,<3.0.6",
  "toml (>=0.10.2,<0.11.0)",
  "click (>=8.4.1,<9.0.0)",
  "gitpython (>=3.1.57,<4.0.0)",
  "humanfriendly (>=10.0,<11.0)",
  "randomname (>=0.2.1,<0.3.0)",
  "numpy (>=2.0.0,<3.0.0)",
  "semver (>=3.0.4,<4.0.0)",
  "email-validator (>=2.2.0,<3.0.0)",
  "psutil (>=6.1.1,<8.0.0)",
  "tenacity (>=9.0.0,<10.0.0)",
  "typing-extensions (>=4.12.2,<5.0.0) ; python_version < \"3.11\"",
  "deepmerge (>=2.0,<3.0)",
  "geocoder (>=1.38.1,<2.0.0)",
  "pydantic-extra-types (>=2.10.5,<3.0.0)",
  "pyyaml (>=6.0.2,<7.0.0)",
  "flatdict (==4.1.0)",
  "pytest (>=9.0.3,<10.0.0)",
  "unyt (>=3.1.0,<4.0.0)",
  "pip>=26.1.2",
  "msgpack>=1.2.1",
]

[project.urls]
homepage = "https://simvue.io"
repository = "https://github.com/simvue-io/python-api"
documentation = "https://docs.simvue.io"

[project.optional-dependencies]
plot = ["plotly (>=6.0.0,<7.0.0)", "matplotlib (>=3.10.0,<4.0.0)"]

[project.scripts]
simvue-sender = "simvue.bin.sender:sender_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "interrogate>=1.7.0",
  "jinja2>=3.1.6",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-sugar>=1.1.1",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.14",
  "types-requests>=2.33.0.20260518",
]

[tool.ruff]
extend-exclude = ["tests", "examples", "notebooks", "simvue/pynvml.py"]
preview = true

[tool.ruff.lint]
ignore = ["COM812", "PLR0904", "PLR6301", "D203", "D212", "PLW0717"]
dummy-variable-rgx = "^_+$"
extend-select = [
  "C90",
  "D417",
  "E",
  "F",
  "W",
  "B",
  "UP",
  "I",
  "SIM",
  "ARG",
  "RUF",
  "RET",
  "S",
  "BLE",
  "FBT",
  "COM",
  "A",
  "C4",
  "DTZ",
  "ICN",
  "G",
  "PIE",
  "T20",
  "INP",
  "PYI",
  "PT",
  "Q",
  "RSE",
  "SLOT",
  "TID",
  "TC",
  "ARG",
  "I",
  "D417",
  "ERA",
  "PL",
  "UP",
  "FURB",
  "N",
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.pylint]
max-returns = 8
max-args = 20
max-branches = 15
max-statements = 60

[tool.pytest.ini_options]
addopts = "-p no:warnings --no-cov -n 0"
testpaths = ["tests"]
markers = [
  "cli: Sender CLI tests",
  "eco: tests for emission metrics",
  "client: tests of Simvue client",
  "dispatch: test data dispatcher",
  "run: test the simvue Run class",
  "utilities: test simvue utilities module",
  "scenario: test scenarios",
  "executor: tests of executors",
  "config: tests of simvue configuration",
  "api: tests of RestAPI functionality",
  "unix: tests for UNIX systems only",
  "metadata: tests of metadata gathering functions",
  "online: tests for online functionality",
  "offline: tests for offline functionality",
  "local: tests of functionality which do not involve a server or writing to an offline cache file",
  "object_retrieval: tests relating to retrieval of objects from the server",
  "object_removal: tests relating to removal of objects from the server",
  "filters: tests of filter objects",
]

[tool.interrogate]
ignore-init-method = true
fail-under = 95
verbose = 1
exclude = ["docs", "tests"]

[tool.mypy]
ignore_missing_imports = true
